# CI slice of the self-host stack: just the real backing services (Postgres +
# an S3 server), same images as docker-compose.yml, with fixed throwaway
# credentials and host-published ports so the selfhost vitest suite on the
# runner can hit them (firestore-shim DATABASE_URL branch / blobstore-s3.ts).
#
#   docker compose -f deploy/selfhost/docker-compose.ci.yml up -d --wait
#
# Postgres publishes on 5433 to stay clear of the runner's preinstalled
# PostgreSQL; the S3 server uses SeaweedFS's stock 8333.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fibuki
      POSTGRES_PASSWORD: fibuki-ci
      POSTGRES_DB: fibuki_ci
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibuki -d fibuki_ci"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SeaweedFS, not MinIO. MinIO's server repo is ARCHIVED upstream (read-only
  # since 2026-04-24), its last release carrying binaries is the very tag this
  # file used to pin, and the images then went from Docker Hub AND quay.io. So
  # this is not another registry hiccup to re-pin around: the thing is no
  # longer published, and staying on it means running an unmaintained store in
  # front of customer documents.
  #
  # SeaweedFS is Apache-2.0, actively developed, and speaks the same S3 API, so
  # blobstore-s3.ts and its `minio` npm client (also Apache-2.0, also still
  # maintained) reach it unchanged. The protocol is the contract here, not the
  # vendor — which is the whole reason this swap is a compose edit.
  #
  # Pinned to a release tag, not `latest` or `dev`, for exactly the reason the
  # previous comment here gave: a floating tag is what turns an upstream change
  # into an outage with no code change on our side.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # All-in-one (master + volume + filer + S3) in one process, which is what a
    # CI backing service wants. `-s3.config` gives it the same fixed throwaway
    # credentials the suite signs with; without it the gateway would accept
    # anonymous writes and the tests would pass while proving less.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs-s3-ci.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
