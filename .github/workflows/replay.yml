# Replay a PR against the real accounts on the box (docs/replay.md).
#
# Runs by itself on every push to a PR that changes the matching code (the
# paths in MATCHING_PATHS below), and on any PR that carries the `replay`
# label. It runs the matcher over each benchmark account on fibuki.com, once
# on the PR's base commit and once on its head, and posts the counts as one PR
# comment (updated in place). It warns, it never blocks: the check passes
# whatever the verdict. The data never leaves the box: the runner ships the
# two functions/ trees in and gets a JSON of counts back. The full reports,
# with bank lines in them, stay under /opt/fibuki-replay/reports and are read
# on fibuki.com/admin/replay by each account's owner.
#
# Same key and host as deploy-hetzner.yml. A fork PR and a Dependabot PR never
# run: GitHub hands neither the secrets, and the job condition says so up front.

name: Replay

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Whether this push needs a replay: the label, or a change to what the
  # replay's sheet runs (the matcher, its inputs and the writers it reads).
  decide:
    name: Does this PR change matching?
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - name: Read the changed files
        id: files
        uses: actions/github-script@v8
        env:
          MATCHING_PATHS: >-
            ^functions/src/(matching|fileConnections|partners|fileFacts|receiptPairs|replay)/
            ^functions/src/utils/(partner-matcher|filePartnerMatcher|category-matcher|identity-matcher)\.ts$
        with:
          script: |
            const labelled = context.payload.pull_request.labels.some((l) => l.name === "replay");
            if (context.payload.action === "labeled" && context.payload.label?.name !== "replay") {
              core.setOutput("run", "false");
              return;
            }
            const patterns = process.env.MATCHING_PATHS.split(/\s+/).filter(Boolean).map((p) => new RegExp(p));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const touched = files
              .map((f) => f.filename)
              .filter((name) => !/\.test\.ts$|__tests__\//.test(name))
              .filter((name) => patterns.some((p) => p.test(name)));
            core.info(touched.length ? `matching files changed:\n${touched.join("\n")}` : "no matching files changed");
            core.setOutput("run", labelled || touched.length > 0 ? "true" : "false");

  replay:
    name: Replay on fibuki.com
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Load the deploy key, pin the host key
        id: key
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_KEY:?HETZNER_SSH_KEY is not set}"
          : "${KNOWN_HOSTS:?HETZNER_SSH_KNOWN_HOSTS is not set}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Ship both functions/ trees
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          : "${HOST:?HETZNER_HOST is not set}"
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$DEPLOY_USER@$HOST" "mkdir -p /opt/fibuki-replay/src/$PR/head /opt/fibuki-replay/src/$PR/base"
          for side in head base; do
            rsync -az --delete --exclude node_modules --exclude lib --exclude '.env*' \
              -e "$SSH" "$side/functions/" "$DEPLOY_USER@$HOST:/opt/fibuki-replay/src/$PR/$side/functions/"
          done
          # The box-side script comes from the PR head, so a change to it is tested by itself.
          rsync -az -e "$SSH" head/deploy/selfhost/replay.sh "$DEPLOY_USER@$HOST:/opt/fibuki-replay/replay.sh"

      - name: Run the replay on the box
        id: run
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          out=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" "bash /opt/fibuki-replay/replay.sh '$PR' '$HEAD_SHA' '$BASE_SHA'")
          printf '%s\n' "$out" | sed '$d'
          summary=$(printf '%s\n' "$out" | tail -1 | sed -n 's/^REPLAY_SUMMARY=//p')
          [ -n "$summary" ] || { echo "no summary line from the box"; exit 1; }
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Post the counts on the PR
        uses: actions/github-script@v8
        env:
          SUMMARY: ${{ steps.run.outputs.summary }}
          APP_URL: ${{ vars.FIBUKI_APP_URL || 'https://fibuki.com' }}
        with:
          script: |
            const s = JSON.parse(process.env.SUMMARY);
            const marker = "<!-- fibuki-replay -->";
            const rows = s.accounts.map((a) =>
              `| ${a.label} | ${a.files.changed} / ${a.files.total} | ${a.transactions.changed} / ${a.transactions.total} | ` +
              `${a.counts.now_agrees} | ${a.counts.now_disagrees + a.counts.contradicts} | ${a.counts.unverified} |`);
            const worse = s.accounts.some((a) => a.counts.now_disagrees + a.counts.contradicts > 0);
            const changed = s.accounts.some((a) => a.files.changed + a.transactions.changed > 0);
            const verdict = worse
              ? "**Something got worse** against a hand decision. Start with the ❌ rows in the report."
              : changed
                ? "**Nothing got worse** against the hand decisions. Read the ❓ rows in the report."
                : "**No behaviour change.** The branch decides every File and Transaction as the base does.";
            const body = [
              marker,
              `## Replay: \`${s.head.slice(0, 7)}\` vs base \`${s.base.slice(0, 7)}\``,
              "",
              "| Account | Files changed | Transactions changed | ✅ | ❌ | ❓ |",
              "|---|---:|---:|---:|---:|---:|",
              ...rows,
              "",
              verdict,
              "",
              `Full report, per account owner: ${process.env.APP_URL}/admin/replay?pr=${s.pr} (counts only here; the rows hold real bank lines).`,
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
