name: CI

on:
  pull_request:
    branches: [main]

jobs:
  diag:
    name: htmlToPdf warm-up diag (${{ matrix.pre }} ${{ matrix.n }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pre: [none, fclist, version, headless]
        n: [1, 2]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: pre-step
        run: |
          s=$(date +%s%3N)
          case "${{ matrix.pre }}" in
            fclist) fc-list > /dev/null ;;
            version) google-chrome --version ;;
            headless) google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 ;;
          esac
          echo "PRESTEP ${{ matrix.pre }} took $(( $(date +%s%3N) - s ))ms"
      - name: cold run
        run: npm test -- integration.test.ts
