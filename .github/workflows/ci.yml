name: CI

on:
  pull_request:
    branches: [main]

jobs:
  diag:
    name: htmlToPdf phase diag (${{ matrix.n }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: cold run
        run: date +%s%3N; npm test -- integration.test.ts; date +%s%3N
        env:
          DEBUG: "puppeteer:browsers:launcher"
      - name: warm run
        run: date +%s%3N; npm test -- integration.test.ts; date +%s%3N
