name: CI

on:
  pull_request:
    branches: [main]

jobs:
  diag:
    name: chrome-launch diag (${{ matrix.mode }} ${{ matrix.n }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [idle, loaded]
        n: [1, 2, 3]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: |
          nproc; free -m | head -2; google-chrome --version
          ls ~/.cache/fontconfig 2>/dev/null | wc -l; fc-list | wc -l; df -h /dev/shm | tail -1
      - name: idle cold launch, then warm
        if: matrix.mode == 'idle'
        run: |
          node diag-chrome.cjs cold 2> cold.err; node diag-chrome.cjs warm 2> warm.err
          for f in cold warm; do echo "== $f"; grep -v "^\[ *[0-9]*\] *$" $f.err | head -60; done
      - name: launch while the unit suite runs
        if: matrix.mode == 'loaded'
        run: |
          (npm test -- --exclude src/precision-search/htmlToPdf.integration.test.ts > suite.log 2>&1; echo "SUITE DONE $(date +%s)" >> suite.log) &
          sleep 15; date +%s; uptime
          node diag-chrome.cjs loaded-cold 2> cold.err; uptime
          node diag-chrome.cjs loaded-second 2> warm.err; uptime
          wait; tail -3 suite.log
          for f in cold warm; do echo "== $f"; grep -v "^\[ *[0-9]*\] *$" $f.err | head -60; done
